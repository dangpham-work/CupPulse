# CI (NFR-16, Task 4.4): mỗi pull request vào main chạy Install → Lint → Unit Test → Build.
# Branch protection của main yêu cầu job "quality" và "integration" pass mới được merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Install → Lint → Unit Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chuẩn bị (build shared, prisma generate)
        run: |
          pnpm build:shared
          pnpm --filter @brewlite/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  integration:
    name: Integration Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_ci
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite_ci@localhost:5432/brewlite?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared, prisma generate
        run: |
          pnpm build:shared
          pnpm --filter @brewlite/api prisma:generate

      - name: Migrate + seed (tái tạo DB từ đầu)
        run: |
          pnpm --filter @brewlite/api db:migrate
          pnpm --filter @brewlite/api db:seed
          pnpm --filter @brewlite/api db:seed

      - name: Integration Test
        run: pnpm --filter @brewlite/api test:int

  e2e:
    name: E2E (Playwright, web + API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_ci
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite_ci@localhost:5432/brewlite?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared, prisma generate, build API và web
        run: |
          pnpm build:shared
          pnpm --filter @brewlite/api prisma:generate
          pnpm --filter @brewlite/api build
          pnpm --filter @brewlite/web build

      - name: Migrate + seed
        run: |
          pnpm --filter @brewlite/api db:migrate
          pnpm --filter @brewlite/api db:seed

      - name: Khởi động API và web
        run: |
          (cd apps/api && PORT=4000 node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && PORT=3000 pnpm start > ../../web.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 90000 http://localhost:4000/health http://localhost:3000

      - name: Cài trình duyệt Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            api.log
            web.log
          if-no-files-found: ignore

  docker:
    name: Docker build (web, api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image API
        run: docker build -f apps/api/Dockerfile -t brewlite-api:ci .

      - name: Build image Web
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 -t brewlite-web:ci .
